<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remediation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <main class="stage">
      <canvas id="scene-canvas" aria-hidden="true"></canvas>
    </main>
    <aside class="sidebar-column">
      <div class="sidebar">
        <header class="sidebar-header">The Quest Remediation</header>
        <div class="sidebar-text" id="sidebar-text">
          <p class="page-text" id="page-text"></p>
          <section class="quote-stack" id="quote-stack" aria-label="Quotes from the story">
            <blockquote class="quote-card">
              <p class="quote-text"><q class="quote-content"></q> (<span class="quote-page"></span>)</p>
            </blockquote>
            <blockquote class="quote-card">
              <p class="quote-text"><q class="quote-content"></q> (<span class="quote-page"></span>)</p>
            </blockquote>
            <blockquote class="quote-card">
              <p class="quote-text"><q class="quote-content"></q> (<span class="quote-page"></span>)</p>
            </blockquote>
          </section>
        </div>
        <button class="scroll-hint" id="scroll-hint" type="button" aria-controls="sidebar-text" hidden>
          <span class="scroll-hint-arrow" aria-hidden="true">↓</span>
          <span class="scroll-hint-label">Scroll for more</span>
        </button>
        <div class="page-counter" id="page-counter"></div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-button" id="prev-button" type="button" aria-label="Previous page">&#8592;</button>
        <button class="nav-button" id="next-button" type="button" aria-label="Next page">&#8594;</button>
      </nav>
    </aside>
  </div>
  <script src="renders.js"></script>
  <script src="pageflip.js"></script>
</body>
</html>
